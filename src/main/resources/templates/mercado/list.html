<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>

<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container pb-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-0"><i class="bi bi-shop text-success me-2"></i>Produtos do Mercado Express</h1>
            <p class="text-muted mb-0 small">Escolha a quantidade e clique em <i class="bi bi-cart-plus"></i> para adicionar ao carrinho.</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/mercado/novo}" class="btn btn-mx"><i class="bi bi-plus-lg me-1"></i>Novo produto</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}"><i class="bi bi-check-circle-fill me-1"></i><span th:text="${sucesso}"></span></div>
    <div class="alert alert-danger" th:if="${erro}"><i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${erro}"></span></div>

    <form th:action="@{/mercado}" method="get" class="row g-2 mb-3">
        <div class="col-sm-8 col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" name="busca" th:value="${busca}" class="form-control" placeholder="Buscar produto pelo nome">
            </div>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-success"><i class="bi bi-search me-1"></i>Buscar</button>
            <a th:if="${busca}" th:href="@{/mercado}" class="btn btn-link text-muted">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Setor</th>
                        <th>Tamanho</th>
                        <th>Preço</th>
                        <th sec:authorize="hasRole('ADMIN')">Custo</th>
                        <th>Estoque</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="mercado : ${mercados}">
                        <td th:text="${mercado.id}"></td>
                        <td th:text="${mercado.nome}"></td>
                        <td th:text="${mercado.tipo}"></td>
                        <td th:text="${mercado.setor}"></td>
                        <td th:text="${#numbers.formatDecimal(mercado.tamanho, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-nowrap" th:text="${'R$ ' + #numbers.formatDecimal(mercado.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td sec:authorize="hasRole('ADMIN')" class="text-nowrap text-muted" th:text="${mercado.custo != null} ? ${'R$ ' + #numbers.formatDecimal(mercado.custo, 1, 'POINT', 2, 'COMMA')} : '-'"></td>
                        <td th:text="${mercado.estoque}"></td>
                        <td class="text-end text-nowrap">
                            <form th:action="@{/carrinho/adicionar}" method="post" class="d-inline-flex gap-1 align-items-center me-1">
                                <input type="hidden" name="produtoId" th:value="${mercado.id}">
                                <input type="number" name="quantidade" value="1" min="1" th:max="${mercado.estoque}" class="form-control form-control-sm qtd-input" aria-label="Quantidade" th:disabled="${mercado.estoque < 1}">
                                <button type="submit" class="btn btn-sm btn-mx" title="Adicionar ao carrinho" th:disabled="${mercado.estoque < 1}"><i class="bi bi-cart-plus"></i></button>
                            </form>
                            <a th:href="@{/mercado/{id}(id=${mercado.id})}" class="btn btn-sm btn-outline-primary" title="Ver"><i class="bi bi-eye"></i> Ver</a>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/mercado/{id}/editar(id=${mercado.id})}" class="btn btn-sm btn-outline-warning" title="Editar"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/mercado/{id}/excluir(id=${mercado.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Confirma a exclusão deste produto?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i> Excluir</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(mercados)}">
                        <td colspan="9" class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block mb-1"></i>Nenhum produto encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
