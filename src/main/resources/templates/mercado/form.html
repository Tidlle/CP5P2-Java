<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar produto' : 'Novo produto')}"></head>
<body>

<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container pb-5">
    <div class="card shadow-sm" style="max-width: 560px;">
        <div class="card-body">
            <h1 class="h4 mb-3"><i class="bi text-success me-2" th:classappend="${modoEdicao} ? 'bi-pencil-square' : 'bi-plus-circle'"></i><span th:text="${modoEdicao} ? 'Editar produto' : 'Novo produto'"></span></h1>

            <form th:action="${modoEdicao} ? @{/mercado/{id}(id=${mercado.id})} : @{/mercado}"
                  th:object="${mercado}" method="post" novalidate>

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="tipo" class="form-label">Tipo</label>
                        <input type="text" class="form-control" th:field="*{tipo}" placeholder="Ex.: Fruta, Limpeza"
                               th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="setor" class="form-label">Setor</label>
                        <input type="text" class="form-control" th:field="*{setor}" placeholder="Ex.: Hortifruti, Meias"
                               th:classappend="${#fields.hasErrors('setor')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{setor}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="custo" class="form-label">Custo (R$)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{custo}"
                               th:classappend="${#fields.hasErrors('custo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{custo}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="preco" class="form-label">Preço de venda (R$)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{preco}"
                               th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{preco}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="tamanho" class="form-label">Tamanho</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{tamanho}"
                               th:classappend="${#fields.hasErrors('tamanho')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{tamanho}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="estoque" class="form-label">Estoque</label>
                        <input type="number" step="1" class="form-control" th:field="*{estoque}"
                               th:classappend="${#fields.hasErrors('estoque')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{estoque}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/mercado}" class="btn btn-secondary"><i class="bi bi-x-lg me-1"></i>Cancelar</a>
                    <button type="submit" class="btn btn-mx"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
