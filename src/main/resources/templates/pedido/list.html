<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minhas compras')}"></head>
<body>

<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container pb-5">

    <h1 class="h3 mb-3"><i class="bi bi-receipt text-success me-2"></i>Minhas compras</h1>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>Pedido</th>
                        <th>Data</th>
                        <th>Itens</th>
                        <th>Pagamento</th>
                        <th class="text-end">Total</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td class="font-monospace" th:text="${#strings.toUpperCase(#strings.substring(p.codigo, 0, 8))}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(p.dataCriacao, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${p.quantidadeItens}"></td>
                        <td th:text="${p.formaPagamento.descricao}"></td>
                        <td class="text-end text-nowrap" th:text="${'R$ ' + #numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td><span th:replace="~{fragments/layout :: statusPedido(${p.status})}"></span></td>
                        <td class="text-end"><a th:href="@{/pedidos/{c}(c=${p.codigo})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i> Detalhes</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-bag fs-3 d-block mb-1"></i>Você ainda não fez compras.
                            <a th:href="@{/mercado}">Ver produtos</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
