<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Todos os pedidos')}"></head>
<body>

<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container pb-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-list-check text-success me-2"></i>Todos os pedidos</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-success"><i class="bi bi-bar-chart-line me-1"></i>Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-success">
                    <tr>
                        <th>Pedido</th>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>Canal</th>
                        <th class="text-end">Total</th>
                        <th class="text-end">Lucro</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td class="font-monospace" th:text="${#strings.toUpperCase(#strings.substring(p.codigo, 0, 8))}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(p.dataCriacao, 'dd/MM/yyyy HH:mm')}"></td>
                        <td><div th:text="${p.clienteNome}"></div><div class="small text-muted" th:text="${p.clienteEmail}"></div></td>
                        <td><span class="badge text-bg-light border" th:text="${p.origem}"></span></td>
                        <td class="text-end text-nowrap" th:text="${'R$ ' + #numbers.formatDecimal(p.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-end text-nowrap" th:text="${'R$ ' + #numbers.formatDecimal(p.lucro, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td><span th:replace="~{fragments/layout :: statusPedido(${p.status})}"></span></td>
                        <td class="text-end"><a th:href="@{/pedidos/{c}(c=${p.codigo})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-4">Nenhum pedido registrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
